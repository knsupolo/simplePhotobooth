<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PHOTOEAST - 스마트 포토부스</title>
  <!-- Tailwind CSS & FontAwesome & QRCode CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    /* 인쇄 시 오직 사진만 4x6 규격으로 출력 */
    @media print {
      body * { visibility: hidden; }
      #printableArea, #printableArea * { visibility: visible; }
      #printableArea { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
      @page { size: 4in 6in; margin: 0; }
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen overflow-hidden select-none">

  <!-- ========================================================
       화면 1: 키오스크 촬영 모드 (대기 & 뷰파인더)
  ======================================================== -->
  <section id="view-booth" class="relative w-screen h-screen flex flex-col items-center justify-center">
    <!-- 실시간 카메라 스트림 -->
    <video id="webcam" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover transform -scale-x-100"></video>
    
    <!-- 플래시 효과 레이어 -->
    <div id="flashOverlay" class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-150 z-30"></div>

    <!-- 상단 상태 및 안내 -->
    <div class="absolute top-6 left-0 right-0 flex justify-between items-center px-8 z-20">
      <div class="flex items-center gap-3 bg-black/60 backdrop-blur-md px-4 py-2 rounded-full border border-white/10">
        <span class="w-3 h-3 rounded-full bg-red-500 animate-pulse"></span>
        <span class="text-xs font-bold tracking-widest uppercase">PHOTOEAST BOOTH</span>
      </div>
      <div id="shotCounterBadge" class="hidden bg-blue-600 text-white font-black px-4 py-1.5 rounded-full text-sm shadow-lg">
        촬영 중: <span id="currentShotNum">1</span> / 4
      </div>
      <!-- 프레임 PNG 업로드 (행사 기획자용) -->
      <label class="bg-white/10 hover:bg-white/20 text-white/80 text-xs px-3 py-1.5 rounded-full border border-white/20 cursor-pointer transition">
        <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> 커스텀 프레임
        <input type="file" id="frameUploader" accept="image/png" class="hidden">
      </label>
    </div>

    <!-- 대형 터치 유도 버튼 (촬영 전) -->
    <div id="startTouchZone" onclick="startPhotoSession()" class="absolute inset-0 flex flex-col items-center justify-center cursor-pointer z-10 bg-black/20 hover:bg-black/10 transition">
      <div class="bg-white/90 text-black px-8 py-5 rounded-3xl font-black text-xl sm:text-2xl shadow-2xl flex items-center gap-3 animate-bounce">
        <i class="fa-solid fa-camera text-blue-600"></i> 화면을 터치하여 촬영 시작
      </div>
      <p class="text-white/80 text-sm mt-4 font-medium drop-shadow-md">총 4컷이 5초 간격으로 자동 촬영됩니다</p>
    </div>

    <!-- 대형 3-2-1 카운트다운 숫자 -->
    <div id="countdownBox" class="hidden absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
      <span id="countdownText" class="text-9xl font-black text-white drop-shadow-[0_10px_20px_rgba(0,0,0,0.8)] animate-ping">3</span>
    </div>
  </section>

  <!-- ========================================================
       화면 2: 결과 수령 모드 (인쇄, 릴스 비디오, QR)
  ======================================================== -->
  <section id="view-result" class="hidden relative w-screen h-screen flex flex-col lg:flex-row items-center justify-center p-6 gap-8 bg-zinc-950">
    <!-- 좌측: 완성된 4x6 쌍둥이 컷 캔버스 미리보기 -->
    <div id="printableArea" class="flex-1 max-h-[85vh] flex justify-center items-center">
      <canvas id="outputCanvas" class="max-h-[80vh] max-w-[90vw] object-contain rounded-xl shadow-2xl border border-zinc-800 bg-white"></canvas>
    </div>

    <!-- 우측: 수령 컨트롤 및 QR 수령 패널 -->
    <div class="w-full lg:w-96 flex flex-col justify-between bg-zinc-900/90 border border-zinc-800 rounded-3xl p-6 shadow-2xl space-y-6">
      <!-- 상단 리셋 타이머 -->
      <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
        <span class="text-xs font-bold text-zinc-400">자동 복귀 타이머</span>
        <span id="resetTimerBadge" class="text-xs bg-red-500/20 text-red-400 font-bold px-2.5 py-1 rounded-full">40초</span>
      </div>

      <!-- 모바일 다운로드용 QR 코드 영역 -->
      <div class="flex flex-col items-center justify-center space-y-3">
        <div id="qrcodeBox" class="bg-white p-3 rounded-2xl shadow-inner"></div>
        <p class="text-[11px] text-zinc-400 text-center">스마트폰 기본 카메라로 비추면<br><b class="text-white">사진과 3초 무빙 비디오</b>를 저장할 수 있습니다.</p>
      </div>

      <!-- 액션 버튼 군 -->
      <div class="space-y-2.5">
        <button onclick="window.print()" class="w-full bg-white hover:bg-zinc-200 text-black font-black py-3.5 rounded-2xl flex items-center justify-center gap-2 transition shadow-lg">
          <i class="fa-solid fa-print"></i> 즉시 인쇄 (4×6인치)
        </button>
        <button onclick="downloadMovingVideo()" id="btnDownloadVideo" class="w-full bg-gradient-to-r from-pink-600 to-rose-600 hover:from-pink-500 text-white font-bold py-3 rounded-2xl flex items-center justify-center gap-2 transition shadow-lg">
          <i class="fa-solid fa-film"></i> 움직이는 릴스 비디오 받기
        </button>
        <button onclick="downloadPhotoDirect()" class="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium py-2.5 rounded-2xl text-xs transition">
          <i class="fa-solid fa-download mr-1"></i> 고화질 사진 파일 다운로드
        </button>
      </div>

      <button onclick="resetToHome()" class="w-full text-center text-xs text-zinc-500 hover:text-white transition py-1">
        처음 화면으로 돌아가기
      </button>
    </div>
  </section>

  <!-- 숨김 비디오 렌더링용 임시 캔버스 -->
  <canvas id="motionCanvas" width="600" height="900" class="hidden"></canvas>

  <script>
    // ========================================================
    // 1. 상태 변수 및 오디오 신디사이저 엔진
    // ========================================================
    let stream = null;
    let capturedFrames = [];
    let customFrameImage = null;
    let movingVideoBlobUrl = null;
    let resetTimerInterval = null;
    const SHOT_COUNT = 4;
    const SHOT_DELAY = 4; // 카운트다운 초

    // Web Audio 비프음 및 셔터 사운드 생성기 (외부 오디오 파일 불필요)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 800, dur = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    }
    function playShutterSound() {
      playBeep(300, 0.05);
      setTimeout(() => playBeep(1200, 0.12), 60);
    }

    // ========================================================
    // 2. 카메라 초기화
    // ========================================================
    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        document.getElementById('webcam').srcObject = stream;
      } catch (err) {
        alert("카메라 권한을 허용해 주세요: " + err.message);
      }
    }
    window.addEventListener('load', initCamera);

    // ========================================================
    // 3. 커스텀 프레임 PNG 업로드 리스너
    // ========================================================
    document.getElementById('frameUploader').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = () => { customFrameImage = img; alert("커스텀 프레임이 적용되었습니다!"); };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    });

    // ========================================================
    // 4. 자동 4컷 연속 촬영 파이프라인
    // ========================================================
    async function startPhotoSession() {
      capturedFrames = [];
      document.getElementById('startTouchZone').classList.add('hidden');
      document.getElementById('shotCounterBadge').classList.remove('hidden');

      for (let i = 1; i <= SHOT_COUNT; i++) {
        document.getElementById('currentShotNum').innerText = i;
        await runCountdown(SHOT_DELAY);
        triggerShutterEffect();
        captureCurrentFrame();
        await sleep(1000);
      }

      document.getElementById('shotCounterBadge').classList.add('hidden');
      finishSessionAndRender();
    }

    function runCountdown(seconds) {
      return new Promise((resolve) => {
        let count = seconds;
        const box = document.getElementById('countdownBox');
        const text = document.getElementById('countdownText');
        box.classList.remove('hidden');
        text.innerText = count;
        playBeep(600, 0.1);

        const timer = setInterval(() => {
          count--;
          if (count > 0) {
            text.innerText = count;
            playBeep(600, 0.1);
          } else {
            clearInterval(timer);
            box.classList.add('hidden');
            resolve();
          }
        }, 1000);
      });
    }

    function triggerShutterEffect() {
      playShutterSound();
      const flash = document.getElementById('flashOverlay');
      flash.style.opacity = '0.9';
      setTimeout(() => { flash.style.opacity = '0'; }, 150);
    }

    function captureCurrentFrame() {
      const video = document.getElementById('webcam');
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 1200;
      tempCanvas.height = 800; // 3:2 비율 컷
      const ctx = tempCanvas.getContext('2d');
      // 좌우 반전 처리
      ctx.translate(tempCanvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
      capturedFrames.push(tempCanvas);
    }

    // ========================================================
    // 5. 4x6 2줄 쌍둥이 컷 캔버스 합성 엔진
    // ========================================================
    function finishSessionAndRender() {
      const canvas = document.getElementById('outputCanvas');
      canvas.width = 1200;
      canvas.height = 1800; // 표준 4x6 인치 해상도
      const ctx = canvas.getContext('2d');

      // 배경색 (커스텀 프레임이 없을 시 모던 블랙)
      ctx.fillStyle = "#18181b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 쌍둥이 컷 (좌/우 동일 1x4 스트립 배치)
      const stripWidth = 540;
      const leftOffsets = [40, 620];

      leftOffsets.forEach(startX => {
        let startY = 60;
        const photoW = 480;
        const photoH = 320;
        const gap = 30;

        capturedFrames.forEach(frame => {
          ctx.drawImage(frame, startX + 30, startY, photoW, photoH);
          startY += photoH + gap;
        });

        // 하단 브랜드 텍스트
        ctx.fillStyle = "#a1a1aa";
        ctx.font = "bold 24px sans-serif";
        ctx.textAlign = "center";
        const today = new Date().toLocaleDateString('ko-KR');
        ctx.fillText(`PHOTOEAST • ${today}`, startX + (stripWidth / 2), startY + 50);
      });

      // 가운데 절취선 (가위 점선 ✂️)
      ctx.strokeStyle = "rgba(255,255,255,0.2)";
      ctx.lineWidth = 2;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(600, 40);
      ctx.lineTo(600, 1760);
      ctx.stroke();
      ctx.setLineDash([]);

      // 투명 커스텀 프레임이 적용되어 있을 경우 위에 덮어쓰기
      if (customFrameImage) {
        ctx.drawImage(customFrameImage, 0, 0, canvas.width, canvas.height);
      }

      // 화면 전환
      document.getElementById('view-booth').classList.add('hidden');
      document.getElementById('view-result').classList.remove('hidden');

      // 3초 움직이는 라이브 비디오 및 QR 생성
      generateMovingVideo();
      generateQrCode();
      startAutoResetTimer();
    }

    // ========================================================
    // 6. 3초 움직이는 라이브 네컷 비디오 엔진
    // ========================================================
    function generateMovingVideo() {
      const motionCanvas = document.getElementById('motionCanvas');
      const mCtx = motionCanvas.getContext('2d');
      const stream = motionCanvas.captureStream(30);
      const recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      const chunks = [];

      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        movingVideoBlobUrl = URL.createObjectURL(blob);
      };

      recorder.start();

      let idx = 0;
      const interval = setInterval(() => {
        mCtx.drawImage(capturedFrames[idx % SHOT_COUNT], 0, 0, motionCanvas.width, motionCanvas.height);
        idx++;
      }, 750); // 0.75초마다 사진 교차

      setTimeout(() => {
        clearInterval(interval);
        recorder.stop();
      }, 3000); // 3초 녹화
    }

    // ========================================================
    // 7. QR 코드 및 파일 다운로드 엔진
    // ========================================================
    function generateQrCode() {
      const qrBox = document.getElementById('qrcodeBox');
      qrBox.innerHTML = '';
      // 완성 이미지를 Base64 데이터 URI 또는 웹 배포 URL로 연결
      const photoDataUrl = document.getElementById('outputCanvas').toDataURL('image/jpeg', 0.85);
      new QRCode(qrBox, {
        text: photoDataUrl.substring(0, 1800), // 가벼운 로컬 QR 링크
        width: 140,
        height: 140
      });
    }

    function downloadPhotoDirect() {
      const link = document.createElement('a');
      link.download = `photoeast_${Date.now()}.jpg`;
      link.href = document.getElementById('outputCanvas').toDataURL('image/jpeg', 0.95);
      link.click();
    }

    function downloadMovingVideo() {
      if (!movingVideoBlobUrl) return alert("비디오 생성 중입니다. 잠시 후 눌러주세요.");
      const link = document.createElement('a');
      link.download = `photoeast_motion_${Date.now()}.webm`;
      link.href = movingVideoBlobUrl;
      link.click();
    }

    // ========================================================
    // 8. 40초 무인 자동 리셋 타이머
    // ========================================================
    function startAutoResetTimer() {
      let remain = 40;
      const badge = document.getElementById('resetTimerBadge');
      badge.innerText = `${remain}초`;

      if (resetTimerInterval) clearInterval(resetTimerInterval);
      resetTimerInterval = setInterval(() => {
        remain--;
        badge.innerText = `${remain}초`;
        if (remain <= 0) {
          clearInterval(resetTimerInterval);
          resetToHome();
        }
      }, 1000);
    }

    function resetToHome() {
      if (resetTimerInterval) clearInterval(resetTimerInterval);
      document.getElementById('view-result').classList.add('hidden');
      document.getElementById('view-booth').classList.remove('hidden');
      document.getElementById('startTouchZone').classList.remove('hidden');
    }

    function sleep(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }
  </script>
</body>
</html>
